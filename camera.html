<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPECTRAL CAMERA // SENSITIZED LENS</title>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #05070a;
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.4);
      --red: #ef4444;
      --cyan: #38bdf8;
      --amber: #f59e0b;
      --font-mono: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background: var(--bg);
      color: #cbd5e1;
      font-family: var(--font-mono);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .crt-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      z-index: 500;
    }

    #viewportContainer {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #videoFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #captureCanvas, #compositeCanvas, #refHelperCanvas {
      display: none;
    }

    #capturedImageDisplay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 15;
    }

    /* TELA DE REVELAÇÃO ESPECTRAL (ENQUANTO O INPAINTING NANO BANANA RODA) */
    #developingOverlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 8, 6, 0.85);
      z-index: 18;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 24px;
      backdrop-filter: blur(4px);
    }
    .spinner-ring {
      width: 54px;
      height: 54px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .hud-frame {
      position: absolute;
      inset: 16px;
      border: 1px solid rgba(16, 185, 129, 0.3);
      pointer-events: none;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }

    .reticle-corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid var(--green);
    }
    .c-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .c-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
    .c-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
    .c-br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    .crosshair-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .crosshair-center::before, .crosshair-center::after {
      content: '';
      position: absolute;
      background: rgba(16, 185, 129, 0.5);
    }
    .crosshair-center::before { top: 19px; left: 0; width: 40px; height: 2px; }
    .crosshair-center::after { top: 0; left: 19px; width: 2px; height: 40px; }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      text-shadow: 0 0 5px rgba(0,0,0,0.8);
    }
    .plate-counter {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--green);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: var(--green);
      font-weight: bold;
    }

    .hud-bottom {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-shadow: 0 0 5px rgba(0,0,0,0.8);
      margin-bottom: 90px;
    }
    .status-banner {
      background: rgba(0, 0, 0, 0.75);
      border-left: 3px solid var(--green);
      padding: 6px 10px;
      font-size: 0.75rem;
      letter-spacing: 1px;
    }

    .control-bar {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 0 20px;
    }

    #shutterBtn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, #10b981 0%, #064e3b 100%);
      border: 3px solid #f1f5f9;
      box-shadow: 0 0 20px var(--green-glow);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #shutterBtn:active {
      transform: scale(0.92);
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.8);
    }
    #shutterBtn:disabled {
      background: #334155;
      border-color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.5;
    }

    #btnResetVisor {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--green);
      color: var(--green);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: bold;
      padding: 12px 16px;
      border-radius: 6px;
      cursor: pointer;
      display: none;
    }

    #shutterFlash {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease-out;
    }

    #mobileJumpscareLayer {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #mobileJumpscareVideo {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
  </style>
</head>
<body>

    <img id="capturedImageDisplay" alt="Exposed Plate">

    <div id="developingOverlay">

      </div>
    </div>

    <canvas id="captureCanvas"></canvas>
    <canvas id="compositeCanvas"></canvas>
    <canvas id="refHelperCanvas"></canvas>

  <div class="hud-frame">
    <div class="reticle-corner c-tl"></div>
    <div class="reticle-corner c-tr"></div>

    <div class="reticle-corner c-br"></div>

      <div>

    <div class="hud-bottom">

      <div style="display: flex; justify-content: space-between; font-size: 0.65rem; color: #64748b;">
        <span id="sviDisplay">SPECTRAL INDEX: STANDBY</span>
        <span id="hateAlert">HATE ESCALATION: +5% PER SHOT</span>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAk-aZpWPXD0za40kDF7kwL9ej3EfaYy6E",
      authDomain: "uptime-halloween-2026.firebaseapp.com",
      databaseURL: "https://uptime-halloween-2026-default-rtdb.firebaseio.com",
      projectId: "uptime-halloween-2026",
      storageBucket: "uptime-halloween-2026.firebasestorage.app",
      messagingSenderId: "1020945901960",
      appId: "1:1020945901960:web:5040ae103b7dc347c9723d",
      measurementId: "G-8MPM67BSLB"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const sessionRef = db.ref('montreal_session');

    const videoFeed = document.getElementById('videoFeed');
    const captureCanvas = document.getElementById('captureCanvas');
    const compositeCanvas = document.getElementById('compositeCanvas');
    const refHelperCanvas = document.getElementById('refHelperCanvas');
    const capturedImageDisplay = document.getElementById('capturedImageDisplay');
    const developingOverlay = document.getElementById('developingOverlay');
    const shutterBtn = document.getElementById('shutterBtn');
    const btnResetVisor = document.getElementById('btnResetVisor');
    const shutterFlash = document.getElementById('shutterFlash');
    const statusBanner = document.getElementById('statusBanner');
    const plateCounterDisplay = document.getElementById('plateCounterDisplay');
    const sviDisplay = document.getElementById('sviDisplay');
    const envIndicator = document.getElementById('envIndicator');
    const sfxAudio = document.getElementById('sfxAudio');
    const forensicAudio = document.getElementById('forensicAudio');
    const mobileJumpscareLayer = document.getElementById('mobileJumpscareLayer');
    const mobileJumpscareVideo = document.getElementById('mobileJumpscareVideo');

    let geminiApiKey = "";
    let geminiModel = "gemini-2.5-flash";
    let geminiImageModel = "gemini-2.5-flash-image";
    let cameraEngine = "inpaint"; // "inpaint" (prioridade IA) ou "canvas" (fallback manual)
    let isGameOn = true;
    let isApiLocked = false;
    let filmCount = 10;
    let currentHate = 30;
    let currentTotem = "tv";
    let isTestMode = false;
    let vincentDone = false;
    let lastMobileEventTimestamp = Date.now();
    let lastReloadTimestamp = 0;

    function getMediaPath(filename) {
      return encodeURI("media/" + filename);
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
          audio: false
        });
        videoFeed.srcObject = stream;
      } catch (err) {
        statusBanner.textContent = "CAMERA ERROR: CHECK HTTPS PERMISSIONS";
        statusBanner.style.borderLeftColor = "var(--red)";
      }
    }
    startCamera();

    function updateHudTopLabel() {
      const envTxt = isTestMode ? "ENV: HOME (TEST)" : "ENV: LIVE SCHOOL";
      const engTxt = (cameraEngine === "inpaint") ? "INPAINT AI" : "CANVAS FALLBACK";
      envIndicator.textContent = `${envTxt} // ${engTxt}`;
      envIndicator.style.color = isTestMode ? "var(--amber)" : "#94a3b8";
    }

    sessionRef.on('value', snap => {
      const data = snap.val();
      if (!data) return;

      isGameOn = (data.game_power !== "off");
      isApiLocked = !!data.api_locked || (data.gemini_key === "LOCKED_BY_MASTER");

      if (data.gemini_key && data.gemini_key !== "LOCKED_BY_MASTER") {
        geminiApiKey = data.gemini_key;
      } else if (isApiLocked) {
        geminiApiKey = "";
      }

      if (data.gemini_model) geminiModel = data.gemini_model;
      if (data.gemini_image_model) geminiImageModel = data.gemini_image_model;
      if (data.camera_engine) cameraEngine = data.camera_engine;
      if (data.hate !== undefined) currentHate = data.hate;
      if (data.totem) currentTotem = data.totem;
      if (data.vincent_done !== undefined) vincentDone = data.vincent_done;
      if (data.test_mode !== undefined) isTestMode = data.test_mode;

      updateHudTopLabel();

      if (data.camera_reload_timestamp && data.camera_reload_timestamp !== lastReloadTimestamp) {
        lastReloadTimestamp = data.camera_reload_timestamp;
        filmCount = 10;
        plateCounterDisplay.textContent = `PLATES: 10 / 10`;
      }

      if (data.mobile_event && data.mobile_event.active && data.mobile_event.timestamp > lastMobileEventTimestamp) {
        lastMobileEventTimestamp = data.mobile_event.timestamp;
        triggerMobileJumpscare(data.mobile_event.video);
      }
    });

    function cleanJsonString(str) {
      return str.replace(/```json/gi, '').replace(/```/g, '').trim();
    }

    async function takeSpectralShot() {
      if (!isGameOn || isApiLocked || !geminiApiKey) {
        statusBanner.textContent = "LENS LOCKED BY MASTER TERMINAL // STANDBY";
        statusBanner.style.borderLeftColor = "var(--red)";
        playSfx("Quick Grunt.mp3");
        return;
      }

      if (filmCount <= 0) {
        statusBanner.textContent = "PLATES DEPLETED // AWAIT MASTER RELOAD";
        statusBanner.style.borderLeftColor = "var(--red)";
        playSfx("Quick Grunt.mp3");
        return;
      }

      shutterBtn.disabled = true;
      filmCount--;
      plateCounterDisplay.textContent = `PLATES: ${filmCount} / 10`;

      triggerFlash();
      playSfx("Quick Hiss 1.mp3");

      const newHate = Math.min(100, currentHate + 5);
      sessionRef.update({ hate: newHate });

      // Redimensiona a captura para max 800px para deixar o Inpainting rápido e leve
      const rawW = videoFeed.videoWidth || 640;
      const rawH = videoFeed.videoHeight || 480;
      const scale = Math.min(1, 800 / Math.max(rawW, rawH));
      captureCanvas.width = Math.round(rawW * scale);
      captureCanvas.height = Math.round(rawH * scale);

      const ctx = captureCanvas.getContext('2d');
      ctx.drawImage(videoFeed, 0, 0, captureCanvas.width, captureCanvas.height);

      const base64Data = captureCanvas.toDataURL('image/jpeg', 0.82).split(',')[1];

      statusBanner.textContent = "EXPOSING PLATE // RUNNING SPECTRAL GATEKEEPER...";
      statusBanner.style.borderLeftColor = "var(--amber)";

      await runVisualGatekeeper(base64Data);
    }

    function triggerFlash() {
      shutterFlash.style.opacity = "1";
      setTimeout(() => { shutterFlash.style.opacity = "0"; }, 90);
    }

    // 1. GATEKEEPER RÁPIDO (GEMINI FLASH)
    async function runVisualGatekeeper(imageBase64) {
      const schoolTargetsPrompt = `Analyze the image for paranormal investigation targets in Room Montreal:
- "skull": Human skull or prop on a desk/table.
- "wifi": Wall-mounted Wi-Fi router or electronic networking box.
- "tv": Digital TV screen or large central display.
- "mannequin": Headless mannequin torso wearing a blood-stained striped shirt near window/curtain.
- "mummy": White wrapped mummy or corpse prop near window.
- "spider": Giant spider or arachnid web prop on the wall.
- "tubes": Test tubes, chemical glass vials, or scientific sample rack.`;

      const homeTargetsPrompt = `Analyze the image for test targets in Home Environment:
- "fan": Electric desk fan or standing fan.
- "chair": Dark blue armchair or office chair.
- "tv": Home television screen.
- "table": Glass dining/coffee table.
- "tree": Christmas tree or large indoor decorative plant.`;

      const promptText = `You are a forensic computer vision gatekeeper for an asylum escape room.
${isTestMode ? homeTargetsPrompt : schoolTargetsPrompt}

Strictly output a valid JSON object without markdown:
{
  "target": "skull" | "wifi" | "tv" | "mannequin" | "mummy" | "spider" | "tubes" | "fan" | "chair" | "table" | "tree" | "none",
  "confidence": <0.0 to 1.0>
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${geminiApiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                { inlineData: { mimeType: "image/jpeg", data: imageBase64 } }
              ]
            }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        const resData = await response.json();
        if (!response.ok) {
          throw new Error(resData.error?.message || `HTTP ${response.status}`);
        }

        const rawText = resData.candidates[0].content.parts[0].text;
        const parsed = JSON.parse(cleanJsonString(rawText));
        await handleDetectionOutcome(parsed.target, parsed.confidence, imageBase64);

      } catch (err) {
        console.error("Gatekeeper Error:", err);
        displayStaticFailure(`GATEKEEPER ERROR: ${err.message}`);
      }
    }

    // 2. ROTEAMENTO DOS TOTENS E CHAMADA DE INPAINTING
    async function handleDetectionOutcome(target, confidence, sceneBase64) {
      if (!target || target === "none" || confidence < 0.55) {
        displayStaticFailure("NO ANOMALY OR FORENSIC TRACE DETECTED");
        return;
      }

      let mappedTarget = target;
      if (isTestMode) {
        if (target === "chair") mappedTarget = "skull";
        else if (target === "tv") mappedTarget = "wifi";
        else if (target === "fan") mappedTarget = "tv";
      }

      // Tubos de ensaio são sempre evidência forense pura (+40 SVI)
      if (mappedTarget === "tubes") {
        playForensicReport("Totem_tubes.wav", "FORENSIC LOG: CHEMICAL SAMPLES ACCUMULATED (40)", "SVI: +40");
        freezeView(captureCanvas.toDataURL());
        return;
      }

      // A) ELLIE (Caveira / Cadeira em Casa) -> SEM GHOST ORBS!
      if (mappedTarget === "skull") {
        const elliePrompt = `Image 1 is the real room photograph taken by the student. Image 2 is the character reference for the female ghost entity (Ellie). Edit Image 1 to naturally inpaint and integrate the exact female entity from Image 2 into the room near the skull/desk or sitting on the chair. Preserve the original room walls, furniture, framing, and lighting geometry of Image 1. Give her glowing green eyes, semi-translucent spectral blending, and natural shadows. CRITICAL: Keep the air around her completely clear of any floating light specks or bokeh spheres.`;

        await renderEntityWithSelectedEngine(sceneBase64, "media/Ellie.jpg", false, elliePrompt, () => {
          playForensicReport("Totem_skull.wav", "ENTITY DETECTED: ELLIE HAZAN (BANSHEE)", "SVI: 50 SHARP");
        });
        return;
      }

      // B) VINCENT (Roteador Wi-Fi / TV em Casa) -> COM GHOST ORBS (BOKEH SPECKS) + TRAVA ÚNICA
      if (mappedTarget === "wifi") {
        if (vincentDone) {
          statusBanner.textContent = "RESIDUAL ESSENCE PURGED // ALREADY RECORDED";
          statusBanner.style.borderLeftColor = "var(--cyan)";
          playSfx("Quick Hiss 1.mp3");
          freezeView(captureCanvas.toDataURL());
          return;
        }

        const vincentPrompt = `Image 1 is the real room photograph taken by the student. Image 2 is the character reference for the male ghost entity (Vincent). Edit Image 1 to naturally inpaint and integrate the exact male entity from Image 2 standing near the Wi-Fi router or screen, interacting with the wires with subtle cyan electrical sparks on his fingers. Preserve the original room walls, framing, and lighting of Image 1. CRITICAL: Floating in the air near the figure, add two tiny, out-of-focus glowing pale-white light specks (subtle translucent optical bokeh dust particles / pinpoint lens flare spheres softly illuminated against the dark background).`;

        await renderEntityWithSelectedEngine(sceneBase64, "media/Vincent.jpg", true, vincentPrompt, () => {
          sessionRef.update({ vincent_done: true });
          playForensicReport("Totem_wifi.wav", "ENTITY DETECTED: VINCENT HAZAN (JINN)", "SVI: 0 (EMF LEVEL 5)");
        });
        return;
      }

      // C) IREENA (Se o objeto fotografado for o Totem Ativo atual da Ireena!) -> COM GHOST ORBS (BOKEH SPECKS)
      if (target === currentTotem || mappedTarget === currentTotem) {
        let poseInstruction = "manifesting naturally inside the room near the central screen/totem, glaring forward with hollow dark eyes";
        if (target === "mannequin") {
          poseInstruction = "crawling paranormally upside-down on the ceiling concrete beam right above the headless mannequin, limbs twisted unnaturally against the ceiling surface";
        } else if (target === "mummy") {
          poseInstruction = "lurking closely behind the wrapped mummy prop by the window, peering over its shoulder";
        } else if (target === "spider") {
          poseInstruction = "emerging from the shadows right next to the giant spider web on the wall";
        }

        const ireenaPrompt = `Image 1 is the real room photograph taken by the student. Image 2 is the character reference for the female ghost entity (Ireena). Edit Image 1 to naturally inpaint and integrate the exact female entity from Image 2 ${poseInstruction}. Preserve the original room walls, objects, framing, and lighting geometry of Image 1, casting realistic shadows. CRITICAL: Floating in the air near the figure, add two tiny, out-of-focus glowing pale-white light specks (subtle translucent optical bokeh dust particles / pinpoint lens flare spheres softly illuminated against the dark background).`;

        await renderEntityWithSelectedEngine(sceneBase64, "media/Ireena.jpg", true, ireenaPrompt, () => {
          playForensicReport("Totem_tv.wav", "PRIMARY THREAT CONFIRMED: IREENA (CHANGELING)", "SVI: 137");
        });
        return;
      }

      // D) Se fotografou Manequim, Múmia ou Aranha quando a Ireena NÃO está lá -> Toca o Laudo Forense do Totem
      if (mappedTarget === "mannequin") {
        playForensicReport("Totem_mannequin.wav", "FORENSIC LOG: VINCENT'S FORMER WIFE CLOTHES", "SVI: N/A");
        freezeView(captureCanvas.toDataURL());
        return;
      }
      if (mappedTarget === "mummy") {
        playForensicReport("Totem_mummy.wav", "FORENSIC LOG: CLEAN DISSECTION SPECIMEN", "SVI: N/A");
        freezeView(captureCanvas.toDataURL());
        return;
      }
      if (mappedTarget === "spider") {
        playForensicReport("Totem_spider.wav", "FORENSIC LOG: BIOLOGICAL CORRUPTION BEAST", "SVI: N/A");
        freezeView(captureCanvas.toDataURL());
        return;
      }

      displayStaticFailure(`ENTITY DISPERSED // CURRENTLY HAUNTING: ${currentTotem.toUpperCase()}`);
    }

    // 3. SELETOR DE MOTOR: INPAINTING IA (PRIORIDADE) vs CANVAS (FALLBACK MANUAL)
    async function renderEntityWithSelectedEngine(sceneBase64, ghostImageSrc, hasGhostOrb, inpaintPrompt, onComplete) {
      if (cameraEngine === "canvas") {
        // Só usa Canvas se o Mestre tiver ativado o Fallback Manual no Master App
        generateGhostCompositeCanvas(ghostImageSrc, hasGhostOrb, onComplete);
      } else {
        // Prioridade Total: Nano Banana / Gemini Flash Image Inpainting
        await generateGhostInpaintAI(sceneBase64, ghostImageSrc, inpaintPrompt, onComplete);
      }
    }

    // Converte a imagem de referência local (media/Ellie.jpg, etc.) para Base64
    function loadReferenceImageBase64(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          const maxDim = 768;
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          refHelperCanvas.width = Math.round(img.width * scale);
          refHelperCanvas.height = Math.round(img.height * scale);
          const rCtx = refHelperCanvas.getContext('2d');
          rCtx.drawImage(img, 0, 0, refHelperCanvas.width, refHelperCanvas.height);
          const b64 = refHelperCanvas.toDataURL('image/jpeg', 0.85).split(',')[1];
          resolve(b64);
        };
        img.onerror = () => reject(new Error(`Failed to load ${src}`));
        img.src = src;
      });
    }

    // 4. MOTOR PRINCIPAL: INPAINTING REAL VIA NANO BANANA (gemini-2.5-flash-image)
    async function generateGhostInpaintAI(sceneBase64, ghostImageSrc, inpaintPrompt, onComplete) {
      developingOverlay.style.display = "flex";
      statusBanner.textContent = "NANO BANANA INPAINTING // MANIFESTING ENTITY...";
      statusBanner.style.borderLeftColor = "var(--cyan)";

      try {
        const ghostRefBase64 = await loadReferenceImageBase64(ghostImageSrc);

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${geminiImageModel}:generateContent?key=${geminiApiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: inpaintPrompt },
                { inlineData: { mimeType: "image/jpeg", data: sceneBase64 } },
                { inlineData: { mimeType: "image/jpeg", data: ghostRefBase64 } }
              ]
            }],
            generationConfig: {
              responseModalities: ["TEXT", "IMAGE"]
            }
          })
        });

        const resData = await response.json();
        developingOverlay.style.display = "none";

        if (!response.ok) {
          throw new Error(resData.error?.message || `HTTP ${response.status}`);
        }

        const parts = resData.candidates?.[0]?.content?.parts || [];
        const imgPart = parts.find(p => p.inlineData && p.inlineData.data);

        if (!imgPart) {
          throw new Error("No image returned by model");
        }

        const mime = imgPart.inlineData.mimeType || "image/jpeg";
        const finalImgSrc = `data:${mime};base64,${imgPart.inlineData.data}`;

        freezeView(finalImgSrc);
        if (onComplete) onComplete();

      } catch (err) {
        developingOverlay.style.display = "none";
        console.error("Inpaint AI Error:", err);
        displayStaticFailure(`INPAINT ERROR (${err.message}) // SWITCH TO CANVAS IF NEEDED`);
      }
    }

    // 5. MOTOR FALLBACK MANUAL: CANVAS OVERLAY (SÓ RODA SE ATIVADO NO MASTER APP)
    function generateGhostCompositeCanvas(ghostImageSrc, hasGhostOrb, onComplete) {
      compositeCanvas.width = captureCanvas.width;
      compositeCanvas.height = captureCanvas.height;
      const cCtx = compositeCanvas.getContext('2d');

      cCtx.drawImage(captureCanvas, 0, 0);

      const ghostImg = new Image();
      ghostImg.src = ghostImageSrc;
      ghostImg.onload = () => {
        cCtx.save();
        cCtx.globalAlpha = 0.78;
        cCtx.globalCompositeOperation = "screen";

        const gWidth = compositeCanvas.width * 0.65;
        const gHeight = (ghostImg.height / ghostImg.width) * gWidth;
        const gX = (compositeCanvas.width - gWidth) / 2;
        const gY = compositeCanvas.height - gHeight;

        cCtx.drawImage(ghostImg, gX, gY, gWidth, gHeight);
        cCtx.restore();

        if (hasGhostOrb) {
          drawGhostOrb(cCtx, gX + (gWidth * 0.25), gY + (gHeight * 0.35));
        }

        applyFilmGrain(cCtx, compositeCanvas.width, compositeCanvas.height);

        freezeView(compositeCanvas.toDataURL('image/jpeg', 0.9));
        if (onComplete) onComplete();
      };
      ghostImg.onerror = () => {
        displayStaticFailure("OPTICAL ABERRATION // REFRACTION FAILED");
      };
    }

    function drawGhostOrb(ctx, x, y) {
      ctx.save();
      const radius = 18;
      const gradient = ctx.createRadialGradient(x, y, 2, x, y, radius);
      gradient.addColorStop(0, "rgba(255, 255, 255, 0.95)");
      gradient.addColorStop(0.3, "rgba(167, 243, 208, 0.6)");
      gradient.addColorStop(0.7, "rgba(16, 185, 129, 0.25)");
      gradient.addColorStop(1, "rgba(0, 0, 0, 0)");

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function applyFilmGrain(ctx, width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 22;
        data[i] = Math.min(255, Math.max(0, data[i] + noise));
        data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
        data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function freezeView(imageSrc) {
      capturedImageDisplay.src = imageSrc;
      capturedImageDisplay.style.display = "block";
      btnResetVisor.style.display = "block";
    }

    function resetVisor() {
      capturedImageDisplay.style.display = "none";
      btnResetVisor.style.display = "none";
      shutterBtn.disabled = false;
      statusBanner.textContent = "SENSOR READY // KEEP 1.5m-2m CONTAINMENT DISTANCE";
      statusBanner.style.borderLeftColor = "var(--green)";
      sviDisplay.textContent = "SPECTRAL INDEX: STANDBY";
      forensicAudio.pause();
    }

    function displayStaticFailure(message) {
      statusBanner.textContent = message;
      statusBanner.style.borderLeftColor = "var(--red)";
      playSfx("Quick Hiss 1.mp3");
      freezeView(captureCanvas.toDataURL());
    }

    function playForensicReport(audioFile, bannerText, sviText) {
      statusBanner.textContent = bannerText;
      statusBanner.style.borderLeftColor = "var(--green)";
      sviDisplay.textContent = `SPECTRAL INDEX: ${sviText}`;

      forensicAudio.src = getMediaPath(audioFile);
      forensicAudio.currentTime = 0;
      forensicAudio.play().catch(e => console.log(e));
    }

    function playSfx(audioFile) {
      sfxAudio.src = getMediaPath(audioFile);
      sfxAudio.play().catch(e => console.log(e));
    }

    function triggerMobileJumpscare(videoFile) {
      mobileJumpscareVideo.src = getMediaPath(videoFile);
      mobileJumpscareLayer.style.display = "flex";
      mobileJumpscareVideo.currentTime = 0;
      mobileJumpscareVideo.play().catch(e => console.log(e));

      if (navigator.vibrate) navigator.vibrate([200, 100, 300, 100, 400]);

      mobileJumpscareVideo.onended = () => {
        mobileJumpscareLayer.style.display = "none";
        sessionRef.child('mobile_event').update({ active: false });
      };
    }
  </script>
