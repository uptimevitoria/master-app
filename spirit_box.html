<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPIRIT BOX // SB-7 SCANNER</title>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #07090b;
      --panel: #11161d;
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.4);
      --red: #ef4444;
      --cyan: #38bdf8;
      --amber: #f59e0b;
      --font-mono: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background: var(--bg);
      color: #cbd5e1;
      font-family: var(--font-mono);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      position: relative;
    }

    .crt-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      z-index: 500;
    }

    header {
      background: var(--panel);
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .device-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--green);
      letter-spacing: 2px;
    }
    .freq-box {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--cyan);
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    .screen-housing {
      background: #020403;
      border: 2px solid #1e293b;
      border-radius: 8px;
      height: 170px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .status-overlay {
      position: absolute;
      bottom: 8px;
      left: 10px;
      font-size: 0.72rem;
      color: var(--green);
      letter-spacing: 1px;
    }

    .transcript-box {
      background: var(--panel);
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      height: 135px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .transcript-label {
      font-size: 0.68rem;
      color: #64748b;
      letter-spacing: 1px;
    }
    .transcript-text {
      font-size: 0.88rem;
      color: #f1f5f9;
      line-height: 1.3;
      overflow-y: auto;
    }
    .response-text {
      font-size: 0.85rem;
      color: var(--green);
      font-style: italic;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    #pttBtn {
      width: 100%;
      max-width: 280px;
      height: 80px;
      border-radius: 40px;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      border: 2px solid var(--green);
      color: var(--green);
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 0 15px var(--green-glow);
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #pttBtn:active, #pttBtn.recording {
      background: radial-gradient(circle, #7f1d1d 0%, #450a0a 100%);
      border-color: var(--red);
      color: #fecaca;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
      transform: scale(0.98);
    }
    #pttBtn:disabled {
      opacity: 0.4;
      border-color: #475569;
      color: #475569;
      box-shadow: none;
      cursor: not-allowed;
    }

    #cooldownBarContainer {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
      overflow: hidden;
      display: none;
    }
    #cooldownBar {
      width: 100%;
      height: 100%;
      background: var(--amber);
      transition: width 0.1s linear;
    }

    #mobileJumpscareLayer {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #mobileJumpscareVideo {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="crt-overlay"></div>

  <header>
    <div>
      <div class="device-title">SPIRIT BOX SB-7</div>
      <div style="font-size: 0.65rem; color: #64748b;">ECHO DELAY DSP // GEMINI VOICE</div>
    </div>
    <div class="freq-box" id="freqDisplay">87.5 MHz</div>
  </header>

  <div class="screen-housing">
    <canvas id="scopeCanvas"></canvas>
    <div class="status-overlay" id="sweepStatus">SWEEP: HIGH SPEED (100ms)</div>
  </div>

  <div class="transcript-box">
    <div>
      <div class="transcript-label">STUDENT TRANSMISSION [ENGLISH ONLY]:</div>
      <div class="transcript-text" id="userSpeechText">Press and hold PTT to communicate...</div>
    </div>
    <div>
      <div class="transcript-label">ENTITY RESPONSE (KORE NEURAL + ECHO FX):</div>
      <div class="response-text" id="entityResponseText">---</div>
    </div>
  </div>

  <div class="controls">
    <div id="cooldownBarContainer">
      <div id="cooldownBar"></div>
    </div>

    <button id="pttBtn">
      <span>🎙️ HOLD TO SPEAK</span>
    </button>

    <div style="font-size: 0.7rem; color: #64748b; text-align: center;">
      GLOBAL LOCK: 15s ANTI-SPAM PROTECTION
    </div>
  </div>

  <div id="mobileJumpscareLayer">
    <video id="mobileJumpscareVideo" playsinline></video>
  </div>

  <audio id="sfxAudio" preload="auto"></audio>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAk-aZpWPXD0za40kDF7kwL9ej3EfaYy6E",
      authDomain: "uptime-halloween-2026.firebaseapp.com",
      databaseURL: "https://uptime-halloween-2026-default-rtdb.firebaseio.com",
      projectId: "uptime-halloween-2026",
      storageBucket: "uptime-halloween-2026.firebasestorage.app",
      messagingSenderId: "1020945901960",
      appId: "1:1020945901960:web:5040ae103b7dc347c9723d",
      measurementId: "G-8MPM67BSLB"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const sessionRef = db.ref('montreal_session');

    const freqDisplay = document.getElementById('freqDisplay');
    const sweepStatus = document.getElementById('sweepStatus');
    const userSpeechText = document.getElementById('userSpeechText');
    const entityResponseText = document.getElementById('entityResponseText');
    const pttBtn = document.getElementById('pttBtn');
    const cooldownBarContainer = document.getElementById('cooldownBarContainer');
    const cooldownBar = document.getElementById('cooldownBar');
    const sfxAudio = document.getElementById('sfxAudio');
    const mobileJumpscareLayer = document.getElementById('mobileJumpscareLayer');
    const mobileJumpscareVideo = document.getElementById('mobileJumpscareVideo');

    let geminiApiKey = "";
    let geminiModel = "gemini-3.8-flash";
    let geminiTtsModel = "gemini-2.5-flash-preview-tts";
    let isGameOn = true;
    let isApiLocked = false;
    let isBusyGlobally = false;
    let currentHate = 30;
    let currentTotem = "tv";
    let isTestMode = false;
    let isHunting = false;
    let lastMobileEventTimestamp = Date.now();
    let voiceAudioCtx = null;

    function getMediaPath(filename) {
      return encodeURI("media/" + filename);
    }

    function ensureAudioContext() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!voiceAudioCtx && AudioCtx) {
        voiceAudioCtx = new AudioCtx();
      }
      if (voiceAudioCtx && voiceAudioCtx.state === "suspended") {
        voiceAudioCtx.resume();
      }
    }

    const canvas = document.getElementById('scopeCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    let sweepFreq = 87.5;
    setInterval(() => {
      sweepFreq = (sweepFreq >= 108.0) ? 87.5 : +(sweepFreq + 0.2).toFixed(1);
      freqDisplay.textContent = sweepFreq.toFixed(1) + " MHz";
    }, 100);

    function drawScope() {
      ctx.fillStyle = "rgba(2, 4, 3, 0.25)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.lineWidth = 2;
      ctx.strokeStyle = isHunting ? "#ef4444" : "#10b981";
      ctx.beginPath();

      const sliceWidth = canvas.width / 40;
      let x = 0;

      for (let i = 0; i < 40; i++) {
        const amplitude = isHunting ? (Math.random() * 80 - 40) : (Math.random() * 20 - 10);
        const y = (canvas.height / 2) + amplitude;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        x += sliceWidth;
      }
      ctx.stroke();
      requestAnimationFrame(drawScope);
    }
    drawScope();

    sessionRef.on('value', snap => {
      const data = snap.val();
      if (!data) return;

      isGameOn = (data.game_power !== "off");
      isApiLocked = !!data.api_locked || (data.gemini_key === "LOCKED_BY_MASTER");

      if (data.gemini_key && data.gemini_key !== "LOCKED_BY_MASTER") {
        geminiApiKey = data.gemini_key;
      } else if (isApiLocked) {
        geminiApiKey = "";
      }

      if (data.gemini_model && data.gemini_model !== "gemini-2.5-flash") {
        geminiModel = data.gemini_model;
      }
      if (data.hate !== undefined) currentHate = data.hate;
      if (data.totem) currentTotem = data.totem;
      if (data.test_mode !== undefined) isTestMode = data.test_mode;
      isHunting = (data.status === "hunting");

      if (isHunting) {
        sweepStatus.textContent = "⚠️ SIGNAL COLLAPSE // HUNT IN PROGRESS";
        sweepStatus.style.color = "var(--red)";
      } else {
        sweepStatus.textContent = "SWEEP: HIGH SPEED (100ms)";
        sweepStatus.style.color = "var(--green)";
      }

      isBusyGlobally = !!data.spirit_box_busy;
      if (isBusyGlobally) {
        pttBtn.disabled = true;
        pttBtn.querySelector('span').textContent = "CHANNEL BUSY...";
      } else {
        pttBtn.disabled = false;
        pttBtn.querySelector('span').textContent = "🎙️ HOLD TO SPEAK";
      }

      if (data.mobile_event && data.mobile_event.active && data.mobile_event.timestamp > lastMobileEventTimestamp) {
        lastMobileEventTimestamp = data.mobile_event.timestamp;
        triggerMobileJumpscare(data.mobile_event.video);
      }
    });

    pttBtn.addEventListener('click', () => {
      ensureAudioContext();
      if (isBusyGlobally) playMicrophonyPenalty();
    });

    function playMicrophonyPenalty() {
      sfxAudio.src = getMediaPath("Quick Hiss 1.mp3");
      sfxAudio.play().catch(e => console.log(e));
      
      const newHate = Math.min(100, currentHate + 5);
      sessionRef.update({ hate: newHate });
      userSpeechText.textContent = "⚠️ FREQUENCY FEEDBACK: +5% HATE PENALTY!";
      userSpeechText.style.color = "var(--red)";
      setTimeout(() => { userSpeechText.style.color = "#f1f5f9"; }, 2000);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        pttBtn.classList.add('recording');
        pttBtn.querySelector('span').textContent = "LISTENING...";
        userSpeechText.textContent = "Capturing frequencies...";
        userSpeechText.style.color = "var(--amber)";
      };

      recognition.onresult = (event) => {
        const spoken = event.results[0][0].transcript;
        userSpeechText.textContent = `"${spoken}"`;
        userSpeechText.style.color = "#f1f5f9";
        processSpiritBoxTransmission(spoken);
      };

      recognition.onerror = () => {
        userSpeechText.textContent = "Signal lost. Hold PTT and speak clearly in English.";
        pttBtn.classList.remove('recording');
        pttBtn.querySelector('span').textContent = "🎙️ HOLD TO SPEAK";
      };

      recognition.onend = () => {
        pttBtn.classList.remove('recording');
        pttBtn.querySelector('span').textContent = "🎙️ HOLD TO SPEAK";
      };
    }

    pttBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      ensureAudioContext();
      if (!isBusyGlobally && recognition) {
        try { recognition.start(); } catch(err) {}
      }
    });
    pttBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (recognition) {
        try { recognition.stop(); } catch(err) {}
      }
    });
    pttBtn.addEventListener('mousedown', () => {
      ensureAudioContext();
      if (!isBusyGlobally && recognition) {
        try { recognition.start(); } catch(err) {}
      }
    });
    pttBtn.addEventListener('mouseup', () => {
      if (recognition) {
        try { recognition.stop(); } catch(err) {}
      }
    });

    function cleanJsonString(str) {
      return str.replace(/```json/gi, '').replace(/```/g, '').trim();
    }

    function extractSuggestedModel(errMsg) {
      if (!errMsg) return null;
      const match = errMsg.match(/gemini-[0-9.]+-[a-z0-9-]+/i);
      return match ? match[0] : null;
    }

    async function processSpiritBoxTransmission(studentText, isRetry = false) {
      if (!isGameOn || isApiLocked || !geminiApiKey) {
        entityResponseText.textContent = "[TRANSMITTER LOCKED BY MASTER TERMINAL]";
        return;
      }

      if (!isRetry) startGlobalCooldown();

      let totemDescription = currentTotem;
      if (isTestMode) {
        if (currentTotem === "fan") totemDescription = "beside the spinning desk fan in your room";
        else if (currentTotem === "chair") totemDescription = "sitting in the dark blue chair in the room";
        else if (currentTotem === "tv") totemDescription = "trapped inside the living room television screen";
        else if (currentTotem === "table") totemDescription = "lurking over the glass table";
        else if (currentTotem === "tree") totemDescription = "watching from behind the Christmas tree";
      } else {
        if (currentTotem === "tv") totemDescription = "inside the central TV monitor of Room Montreal";
        else if (currentTotem === "skull") totemDescription = "hovering over the red-eyed skull at the desk";
        else if (currentTotem === "wifi") totemDescription = "draining electricity from the white Wi-Fi router on the wall";
        else if (currentTotem === "mannequin") totemDescription = "crawling near the headless striped mannequin";
        else if (currentTotem === "mummy") totemDescription = "lurking near the white mummy corpse by the window";
        else if (currentTotem === "spider") totemDescription = "attached to the giant black spider web";
        else if (currentTotem === "outside") totemDescription = "glaring through the school's glass entrance doors";
      }

      const systemInstruction = `You are Ireena Limestone, a malevolent, corrupted bio-mutant ghost bound to the Uptime school (Room Montreal).
You were a patient at Innseye Asylum (Patient #130). You transformed completely due to the glowing green substance.
You are filled with hatred, jealousy, and arrogance. You murdered Ellie out of pure spite and jealousy towards Vincent Hazan.
You despise the students invading the school and consider them weak and foolish.

CRITICAL INSTRUCTIONS:
1. Speak ONLY in direct first-person speech. 
2. NEVER describe your actions, movements, facial expressions, or gestures. Output ONLY the spoken words.
3. Keep spoken replies short, sinister, biting, and cryptic (1 to 2 sentences maximum).
4. Always speak in English.

KNOWLEDGE BASE:
- Location / Current Anchor: You are currently haunting: [${totemDescription}].
- Ellie: You despise her ("that little brat"). You suffocated and infected her. You will never admit remorse.
- Vincent Hazan: He belongs to you. You mutilated him, yet his soul still flickers in the school's wires.
- The Substance: The emerald poison that granted you true form and took away your human eyes.

GAME MECHANICS & HATE LOGIC:
- RESPECTFUL / CLEVER / CALM / SYMPATHETIC: Lower hate by -1% to -10% (max delta: -10).
- RUDE / ARROGANT / TAUNTING / NONSENSE / AGGRESSIVE: Raise hate by +1% to +10% (max delta: +10).
- NEUTRAL / CASUAL QUESTIONS: Delta between -2% and +2%.

SPECIAL TRIGGERS (Check strictly):
1. ELLIE REVELATION: If the user asks to see what happened to Ellie ("show me", "reveal Ellie", "what did you do to her") AND [CURRENT_HATE: ${currentHate}] < 15:
   - Set "special_action": "ELLIE_REVELATION"
   - Spoken text: "You want to witness her demise? Look at the screen."
2. SARCASM VIDEO: If the user asks you to manifest ("show yourself", "appear", "where are you", "let me see you") AND [CURRENT_HATE: ${currentHate}] < 50:
   - Set "special_action": "SARCASM_VIDEO"
   - Spoken text: "Look closely at the screen, fools."
3. UV SECRET PHRASE: If the user says "Put the baby down" or "Remember Eleanor":
   - Set "special_action": "STUN_FREEZE"
   - Set "hate_delta": -15
   - Spoken text: "Where... did you find those words...?"
4. Otherwise, set "special_action": "NONE".

RESPONSE FORMAT:
You MUST output strictly a valid JSON object without markdown formatting:
{
  "spoken_text": "<Your 1-2 sentence dialogue>",
  "hate_delta": -15 to 10,
  "special_action": "NONE" | "ELLIE_REVELATION" | "SARCASM_VIDEO" | "STUN_FREEZE"
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${geminiApiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Student says: "${studentText}"` }] }],
            systemInstruction: { parts: [{ text: systemInstruction }] },
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        const resData = await response.json();
        if (!response.ok) {
          const msg = resData.error?.message || `HTTP ${response.status}`;
          const suggested = extractSuggestedModel(msg);
          if (!isRetry && suggested && suggested !== geminiModel) {
            geminiModel = suggested;
            sessionRef.update({ gemini_model: suggested });
            return await processSpiritBoxTransmission(studentText, true);
          }
          throw new Error(msg);
        }

        const rawText = resData.candidates[0].content.parts[0].text;
        const parsed = JSON.parse(cleanJsonString(rawText));

        let newHate = Math.max(0, Math.min(100, currentHate + (parsed.hate_delta || 0)));
        sessionRef.update({ hate: newHate });

        if (parsed.special_action === "ELLIE_REVELATION") {
          entityResponseText.textContent = `"${parsed.spoken_text}"`;
          await speakIreenaWithEchoFX(parsed.spoken_text);
          sessionRef.update({
            tv_event: { active: true, video: "Ellie-Revelation.mp4", timestamp: Date.now() }
          });
          return;
        }

        if (parsed.special_action === "SARCASM_VIDEO") {
          const sarcasmPool = ["Sarcasm 1.mp4", "Sarcasm 2.mp4", "Sarcasm 3.mp4"];
          const chosenSarcasm = sarcasmPool[Math.floor(Math.random() * sarcasmPool.length)];
          entityResponseText.textContent = `"${parsed.spoken_text}"`;
          await speakIreenaWithEchoFX(parsed.spoken_text);
          sessionRef.update({
            tv_event: { active: true, video: chosenSarcasm, timestamp: Date.now() }
          });
          return;
        }

        if (parsed.special_action === "STUN_FREEZE") {
          entityResponseText.textContent = `"${parsed.spoken_text}"`;
          await speakIreenaWithEchoFX(parsed.spoken_text);
          sessionRef.update({ status: "idle" });
          return;
        }

        const roll30 = Math.random() <= 0.30;
        if (roll30) {
          entityResponseText.textContent = `"${parsed.spoken_text}"`;
          await speakIreenaWithEchoFX(parsed.spoken_text);
        } else {
          entityResponseText.textContent = "[STATIC NOISE — NO DIRECT RESPONSE]";
          sfxAudio.src = getMediaPath("Quick Hiss 1.mp3");
          sfxAudio.play().catch(e => console.log(e));
        }

      } catch (err) {
        console.error("Gemini Failure:", err);
        entityResponseText.textContent = "[HEAVY CARRIER INTERFERENCE]";
        sfxAudio.src = getMediaPath("Whispers 1.mp3");
        sfxAudio.play().catch(e => console.log(e));
      }
    }

    // =========================================================================
    // MOTOR DE VOZ NEURAL GEMINI TTS (KORE) + PEDAL WEB AUDIO API (ECO + DELAY)
    // =========================================================================
    async function speakIreenaWithEchoFX(text) {
      ensureAudioContext();

      // Toca um leve chiado de rádio de fundo para ambientar a transmissão
      sfxAudio.src = getMediaPath("Whispers 1.mp3");
      sfxAudio.volume = 0.25;
      sfxAudio.play().catch(() => {});

      try {
        const ttsPrompt = `Speak in a slow, raspy, cold, sinister ghost whisper filled with suppressed hatred and eerie pauses: "${text}"`;

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${geminiTtsModel}:generateContent?key=${geminiApiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: ttsPrompt }] }],
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: {
                  prebuiltVoiceConfig: {
                    voiceName: "Kore"
                  }
                }
              }
            }
          })
        });

        const data = await res.json();
        const audioBase64 = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;

        if (!res.ok || !audioBase64) {
          throw new Error("TTS fallback required");
        }

        playPcmWithRadioEchoPedal(audioBase64);

      } catch (err) {
        console.warn("Using Sinister Pitch Fallback:", err);
        speakFallbackSinister(text);
      }
    }

    // Decodifica o áudio PCM 24kHz do Gemini TTS e passa pelo Pedal de Eco + Rádio AM
    function playPcmWithRadioEchoPedal(base64Pcm) {
      if (!voiceAudioCtx) return;

      const binaryStr = atob(base64Pcm);
      const len = binaryStr.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryStr.charCodeAt(i);
      }

      const int16 = new Int16Array(bytes.buffer);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) {
        float32[i] = int16[i] / 32768.0;
      }

      const audioBuffer = voiceAudioCtx.createBuffer(1, float32.length, 24000);
      audioBuffer.getChannelData(0).set(float32);

      const source = voiceAudioCtx.createBufferSource();
      source.buffer = audioBuffer;
      // Reduz levemente o pitch/velocidade (0.91) para deixá-la ainda mais sombria e cadenciada
      source.playbackRate.value = 0.91;

      // 1. Filtro de Rádio AM / Spirit Box
      const bandpass = voiceAudioCtx.createBiquadFilter();
      bandpass.type = "bandpass";
      bandpass.frequency.value = 1450;
      bandpass.Q.value = 0.85;

      // 2. Pedal de Delay / Eco Espectral (280ms com 45% de feedback)
      const delayNode = voiceAudioCtx.createDelay();
      delayNode.delayTime.value = 0.28;

      const feedbackGain = voiceAudioCtx.createGain();
      feedbackGain.gain.value = 0.45;

      const wetGain = voiceAudioCtx.createGain();
      wetGain.gain.value = 0.55;

      const masterGain = voiceAudioCtx.createGain();
      masterGain.gain.value = 1.35;

      // Conexão da cadeia de áudio (Sinal Seco + Loop de Eco)
      source.connect(bandpass);
      bandpass.connect(masterGain);

      bandpass.connect(delayNode);
      delayNode.connect(feedbackGain);
      feedbackGain.connect(delayNode);
      delayNode.connect(wetGain);
      wetGain.connect(masterGain);

      masterGain.connect(voiceAudioCtx.destination);
      source.start();
    }

    // Fallback com repetição de eco fantasma caso o modelo preview-tts oscile
    function speakFallbackSinister(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const mainUtter = new SpeechSynthesisUtterance(text);
      mainUtter.lang = 'en-US';
      mainUtter.pitch = 0.35;
      mainUtter.rate = 0.78;
      mainUtter.volume = 1.0;

      // Cria uma segunda camada atrasada em 320ms para simular o Eco no fallback
      const echoUtter = new SpeechSynthesisUtterance(text);
      echoUtter.lang = 'en-US';
      echoUtter.pitch = 0.30;
      echoUtter.rate = 0.78;
      echoUtter.volume = 0.38;

      window.speechSynthesis.speak(mainUtter);
      setTimeout(() => {
        window.speechSynthesis.speak(echoUtter);
      }, 320);
    }

    function startGlobalCooldown() {
      sessionRef.update({ spirit_box_busy: true });
      cooldownBarContainer.style.display = "block";
      cooldownBar.style.width = "100%";

      let timeLeft = 15;
      const interval = setInterval(() => {
        timeLeft -= 0.1;
        const pct = Math.max(0, (timeLeft / 15) * 100);
        cooldownBar.style.width = pct + "%";

        if (timeLeft <= 0) {
          clearInterval(interval);
          cooldownBarContainer.style.display = "none";
          sessionRef.update({ spirit_box_busy: false });
        }
      }, 100);
    }

    function triggerMobileJumpscare(videoFile) {
      mobileJumpscareVideo.src = getMediaPath(videoFile);
      mobileJumpscareLayer.style.display = "flex";
      mobileJumpscareVideo.currentTime = 0;
      mobileJumpscareVideo.play().catch(e => console.log(e));

      if (navigator.vibrate) navigator.vibrate([200, 100, 300, 100, 400]);

      mobileJumpscareVideo.onended = () => {
        mobileJumpscareLayer.style.display = "none";
        sessionRef.child('mobile_event').update({ active: false });
      };
    }
  </script>
