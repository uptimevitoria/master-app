<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GHOST SHIELD // CONTAINMENT BARRIER</title>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #030605;
      --panel: #0d1410;
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.45);
      --red: #ef4444;
      --red-glow: rgba(239, 68, 68, 0.5);
      --cyan: #38bdf8;
      --amber: #f59e0b;
      --font-mono: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background: var(--bg);
      color: #cbd5e1;
      font-family: var(--font-mono);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .crt-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      z-index: 500;
    }

    #viewportContainer {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #cameraFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #captureCanvas {
      display: none;
    }

    .shield-reticle {
      position: absolute;
      width: 250px;
      height: 250px;
      border: 2px dashed rgba(16, 185, 129, 0.35);
      border-radius: 50%;
      pointer-events: none;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.1);
      transition: all 0.3s ease;
    }

    .shield-reticle::before {
      content: '';
      position: absolute;
      width: 80%;
      height: 80%;
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 50%;
    }

    header {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 30;
      background: rgba(13, 20, 16, 0.85);
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(4px);
    }
    .shield-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--green);
      letter-spacing: 2px;
    }
    .status-badge {
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .badge-standby { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid var(--green); }
    .badge-hunting { background: rgba(239, 68, 68, 0.2); color: var(--red); border: 1px solid var(--red); animation: pulse 0.8s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    #challengeBanner {
      position: absolute;
      top: 80px;
      left: 16px;
      right: 16px;
      z-index: 30;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--cyan);
      border-radius: 8px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 6px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }
    .challenge-alert {
      font-size: 0.75rem;
      color: var(--red);
      font-weight: bold;
      letter-spacing: 2px;
    }
    .challenge-target {
      font-size: 1.05rem;
      font-weight: bold;
      color: #fff;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
    }

    .footer-bar {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
    }

    #dischargeBtn {
      width: 100%;
      max-width: 290px;
      height: 75px;
      border-radius: 38px;
      background: radial-gradient(circle, #064e3b 0%, #022c22 100%);
      border: 2px solid var(--green);
      color: var(--green);
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 0 20px var(--green-glow);
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #dischargeBtn:active {
      transform: scale(0.97);
    }
    #dischargeBtn:disabled {
      background: #1e293b;
      border-color: #475569;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }

    #statusFeedback {
      font-size: 0.78rem;
      text-align: center;
      letter-spacing: 1px;
      min-height: 1.2em;
      color: #94a3b8;
      text-shadow: 0 0 5px rgba(0,0,0,0.8);
    }

    #shieldSuccessFlash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.85) 0%, rgba(2, 44, 34, 0.98) 100%);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      animation: expandShield 0.5s ease forwards;
    }
    @keyframes expandShield { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    .success-title {
      font-size: 1.6rem;
      font-weight: bold;
      color: #fff;
      letter-spacing: 3px;
      text-shadow: 0 0 20px #fff;
      margin-bottom: 8px;
    }
    .success-sub {
      font-size: 0.85rem;
      color: #a7f3d0;
      letter-spacing: 2px;
      max-width: 320px;
    }

    #mobileJumpscareLayer {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #mobileJumpscareVideo {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="crt-overlay"></div>

  <div id="viewportContainer">
    <video id="cameraFeed" autoplay playsinline muted></video>
    <div class="shield-reticle" id="shieldReticle"></div>
    <canvas id="captureCanvas"></canvas>
  </div>

  <header>
    <div>
      <div class="shield-title">GHOST SHIELD</div>
      <div style="font-size: 0.65rem; color: #64748b;" id="envLabel">SYSTEM: LIVE SCHOOL</div>
    </div>
    <div class="status-badge badge-standby" id="statusBadge">MATRIX: STANDBY</div>
  </header>

  <div id="challengeBanner">
    <div class="challenge-alert">⚠️ HUNT IN PROGRESS // BANISHMENT TARGET:</div>
    <div class="challenge-target" id="challengeTargetText">HOLD UP 3 FINGERS</div>
  </div>

  <div class="footer-bar">
    <div id="statusFeedback">SHIELD ARMED // AWAITING ANOMALOUS HUNT</div>
    <button id="dischargeBtn" onclick="dischargeShield()" disabled>
      <span>🛡️ DISCHARGE SHIELD</span>
    </button>
  </div>

  <div id="shieldSuccessFlash">
    <div style="font-size: 3rem; margin-bottom: 10px;">⚡</div>
    <div class="success-title">CONTAINMENT RESTORED</div>
    <div class="success-sub">HATE DROPPED TO 0% // VINCENT ASSUMING CENTRAL SYSTEM</div>
  </div>

  <div id="mobileJumpscareLayer">
    <video id="mobileJumpscareVideo" playsinline></video>
  </div>

  <audio id="sfxAudio" preload="auto"></audio>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAk-aZpWPXD0za40kDF7kwL9ej3EfaYy6E",
      authDomain: "uptime-halloween-2026.firebaseapp.com",
      databaseURL: "https://uptime-halloween-2026-default-rtdb.firebaseio.com",
      projectId: "uptime-halloween-2026",
      storageBucket: "uptime-halloween-2026.firebasestorage.app",
      messagingSenderId: "1020945901960",
      appId: "1:1020945901960:web:5040ae103b7dc347c9723d",
      measurementId: "G-8MPM67BSLB"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const sessionRef = db.ref('montreal_session');

    const cameraFeed = document.getElementById('cameraFeed');
    const captureCanvas = document.getElementById('captureCanvas');
    const shieldReticle = document.getElementById('shieldReticle');
    const statusBadge = document.getElementById('statusBadge');
    const challengeBanner = document.getElementById('challengeBanner');
    const challengeTargetText = document.getElementById('challengeTargetText');
    const dischargeBtn = document.getElementById('dischargeBtn');
    const statusFeedback = document.getElementById('statusFeedback');
    const shieldSuccessFlash = document.getElementById('shieldSuccessFlash');
    const envLabel = document.getElementById('envLabel');
    const sfxAudio = document.getElementById('sfxAudio');
    const mobileJumpscareLayer = document.getElementById('mobileJumpscareLayer');
    const mobileJumpscareVideo = document.getElementById('mobileJumpscareVideo');

    let geminiApiKey = "";
    let geminiModel = "gemini-3.8-flash";
    let isGameOn = true;
    let isApiLocked = false;
    let isHunting = false;
    let isTestMode = false;
    let currentChallenge = null;
    let lastMobileEventTimestamp = Date.now();

    function getMediaPath(filename) {
      return encodeURI("media/" + filename);
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
          audio: false
        });
        cameraFeed.srcObject = stream;
      } catch (err) {
        statusFeedback.textContent = "CAMERA ERROR: CHECK HTTPS PERMISSIONS";
        statusFeedback.style.color = "var(--red)";
      }
    }
    initCamera();

    const schoolChallenges = [
      { id: "gesture_3", label: "HOLD UP 3 FINGERS TO THE LENS", criteria: "A person's hand clearly displaying the number 3 (three fingers raised)." },
      { id: "pyramid", label: "PHOTOGRAPH PYRAMID TOTEM", criteria: "A pyramid prop or illuminated geometric pyramid." },
      { id: "hand_miniature", label: "PHOTOGRAPH HAND MINIATURE", criteria: "A small severed hand prop or miniature hand figurine." },
      { id: "skull", label: "PHOTOGRAPH RED-EYED SKULL", criteria: "A skull prop with red eyes on a desk/table." }
    ];

    const homeChallenges = [
      { id: "gesture_3", label: "HOLD UP 3 FINGERS TO THE LENS", criteria: "A person's hand clearly displaying the number 3 (three fingers raised)." },
      { id: "mug", label: "PHOTOGRAPH A COFFEE MUG / CUP", criteria: "A ceramic coffee mug, teacup, or drinking cup." },
      { id: "book", label: "PHOTOGRAPH ANY OPEN OR CLOSED BOOK", criteria: "A physical reading book or notebook." },
      { id: "fan", label: "PHOTOGRAPH THE DESK FAN", criteria: "An electric fan with blades." }
    ];

    sessionRef.on('value', snap => {
      const data = snap.val();
      if (!data) return;

      isGameOn = (data.game_power !== "off");
      isApiLocked = !!data.api_locked || (data.gemini_key === "LOCKED_BY_MASTER");

      if (data.gemini_key && data.gemini_key !== "LOCKED_BY_MASTER") {
        geminiApiKey = data.gemini_key;
      } else if (isApiLocked) {
        geminiApiKey = "";
      }

      if (data.gemini_model && data.gemini_model !== "gemini-2.5-flash") {
        geminiModel = data.gemini_model;
      }

      if (data.test_mode !== undefined && data.test_mode !== isTestMode) {
        isTestMode = data.test_mode;
        envLabel.textContent = isTestMode ? "SYSTEM: HOME (TEST MODE)" : "SYSTEM: LIVE SCHOOL";
        envLabel.style.color = isTestMode ? "var(--amber)" : "#64748b";
      }

      const huntingNow = (data.status === "hunting");
      if (huntingNow && !isHunting) {
        enterHuntingState();
      } else if (!huntingNow && isHunting) {
        exitHuntingState();
      }

      if (data.mobile_event && data.mobile_event.active && data.mobile_event.timestamp > lastMobileEventTimestamp) {
        lastMobileEventTimestamp = data.mobile_event.timestamp;
        triggerMobileJumpscare(data.mobile_event.video);
      }
    });

    function enterHuntingState() {
      isHunting = true;
      statusBadge.className = "status-badge badge-hunting";
      statusBadge.textContent = "HUNT ACTIVE!";
      
      const pool = isTestMode ? homeChallenges : schoolChallenges;
      currentChallenge = pool[Math.floor(Math.random() * pool.length)];

      challengeTargetText.textContent = currentChallenge.label;
      challengeBanner.style.display = "flex";
      dischargeBtn.disabled = false;
      dischargeBtn.style.boxShadow = "0 0 25px var(--red-glow)";
      dischargeBtn.style.borderColor = "var(--red)";
      dischargeBtn.style.color = "#fecaca";

      shieldReticle.style.borderColor = "var(--red)";
      shieldReticle.style.boxShadow = "0 0 30px rgba(239, 68, 68, 0.4)";

      statusFeedback.textContent = "FOCUS TARGET IN RETICLE AND DISCHARGE!";
      statusFeedback.style.color = "var(--red)";

      playSfx("Quick Hiss 1.mp3");
      if (navigator.vibrate) navigator.vibrate([150, 100, 150]);
    }

    function exitHuntingState() {
      isHunting = false;
      statusBadge.className = "status-badge badge-standby";
      statusBadge.textContent = "MATRIX: STANDBY";

      challengeBanner.style.display = "none";
      dischargeBtn.disabled = true;
      dischargeBtn.style.boxShadow = "none";
      dischargeBtn.style.borderColor = "var(--green)";
      dischargeBtn.style.color = "var(--green)";

      shieldReticle.style.borderColor = "rgba(16, 185, 129, 0.35)";
      shieldReticle.style.boxShadow = "0 0 25px rgba(16, 185, 129, 0.1)";

      statusFeedback.textContent = "SHIELD ARMED // AWAITING ANOMALOUS HUNT";
      statusFeedback.style.color = "#94a3b8";
    }

    function cleanJsonString(str) {
      return str.replace(/```json/gi, '').replace(/```/g, '').trim();
    }

    function extractSuggestedModel(errMsg) {
      if (!errMsg) return null;
      const match = errMsg.match(/gemini-[0-9.]+-[a-z0-9-]+/i);
      return match ? match[0] : null;
    }

    async function dischargeShield() {
      if (!isHunting || !currentChallenge) return;
      if (!isGameOn || isApiLocked || !geminiApiKey) {
        statusFeedback.textContent = "SHIELD LOCKED BY MASTER TERMINAL!";
        return;
      }

      dischargeBtn.disabled = true;
      statusFeedback.textContent = "ANALYZING TARGET SPECTRAL PATTERN...";
      statusFeedback.style.color = "var(--amber)";

      captureCanvas.width = cameraFeed.videoWidth || 640;
      captureCanvas.height = cameraFeed.videoHeight || 480;
      const ctx = captureCanvas.getContext('2d');
      ctx.drawImage(cameraFeed, 0, 0, captureCanvas.width, captureCanvas.height);

      const base64Data = captureCanvas.toDataURL('image/jpeg', 0.8).split(',')[1];
      await validateShieldTarget(base64Data);
    }

    async function validateShieldTarget(imageBase64, isRetry = false) {
      const promptText = `You are a strict forensic vision validator for a ghost containment shield.
The required target to validate is: "${currentChallenge.label}" (${currentChallenge.criteria}).

Inspect the provided image carefully.
Strictly output a valid JSON object without markdown:
{
  "target_matched": true | false,
  "confidence": 0.0 to 1.0
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${geminiApiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                { inlineData: { mimeType: "image/jpeg", data: imageBase64 } }
              ]
            }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        const resData = await response.json();
        if (!response.ok) {
          const msg = resData.error?.message || `HTTP ${response.status}`;
          const suggested = extractSuggestedModel(msg);
          if (!isRetry && suggested && suggested !== geminiModel) {
            geminiModel = suggested;
            sessionRef.update({ gemini_model: suggested });
            return await validateShieldTarget(imageBase64, true);
          }
          throw new Error(msg);
        }

        const rawText = resData.candidates[0].content.parts[0].text;
        const parsed = JSON.parse(cleanJsonString(rawText));

        if (parsed.target_matched && parsed.confidence >= 0.55) {
          executeShieldSuccess();
        } else {
          executeShieldFailure();
        }

      } catch (err) {
        console.error("Shield Vision Error:", err);
        executeShieldFailure("CARRIER NOISE // RETRY TARGET FRAMING");
      }
    }

    function executeShieldSuccess() {
      shieldSuccessFlash.style.display = "flex";
      playSfx("Quick Hiss 1.mp3");
      if (navigator.vibrate) navigator.vibrate([100, 50, 200, 50, 400]);

      // Zera o Hate (0%) pós-caçada para abrir a janela da revelação da Ellie!
      sessionRef.update({
        status: "vincent_glitch",
        hate: 0,
        tv_event: {
          active: true,
          video: "Vincent-Glitch.mp4",
          timestamp: Date.now()
        }
      });

      setTimeout(() => {
        shieldSuccessFlash.style.display = "none";
        exitHuntingState();
      }, 3500);
    }

    function executeShieldFailure(customMsg) {
      statusFeedback.textContent = customMsg || "CONTAINMENT FAILED: TARGET MISMATCH!";
      statusFeedback.style.color = "var(--red)";
      playSfx("Quick Grunt.mp3");
      if (navigator.vibrate) navigator.vibrate(400);

      setTimeout(() => {
        if (isHunting) {
          dischargeBtn.disabled = false;
          statusFeedback.textContent = "FOCUS TARGET IN RETICLE AND DISCHARGE!";
          statusFeedback.style.color = "var(--red)";
        }
      }, 1500);
    }

    function playSfx(audioFile) {
      sfxAudio.src = getMediaPath(audioFile);
      sfxAudio.play().catch(e => console.log(e));
    }

    function triggerMobileJumpscare(videoFile) {
      mobileJumpscareVideo.src = getMediaPath(videoFile);
      mobileJumpscareLayer.style.display = "flex";
      mobileJumpscareVideo.currentTime = 0;
      mobileJumpscareVideo.play().catch(e => console.log(e));

      if (navigator.vibrate) navigator.vibrate([200, 100, 300, 100, 400]);

      mobileJumpscareVideo.onended = () => {
        mobileJumpscareLayer.style.display = "none";
        sessionRef.child('mobile_event').update({ active: false });
      };
    }
  </script>
</body>
</html>
